# Только вход по ключу
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey

# Без входа под root, только наш пользователь
PermitRootLogin no
AllowUsers admin

# Меньше возможностей для перебора и злоупотреблений
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
