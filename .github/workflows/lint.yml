name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Разметка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  links:
    name: Ссылки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 "**/*.md"
          fail: true

  leaks:
    name: Приватные данные
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: leakcheck
        run: python3 tools/leakcheck.py --all
